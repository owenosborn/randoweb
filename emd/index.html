<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ahh and the Birds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <div class="brand">Ahh and the Birds</div>
    <div class="controls">
      <label>Width:
        <input type="number" id="hp-width" min="2" max="84" step="1" value="12">
        HP
      </label>
      <label><input type="checkbox" id="show-keepouts" checked> Keepouts</label>
      <label><input type="checkbox" id="show-grid" checked> Grid</label>
      <label><input type="checkbox" id="snap-grid" checked> Snap 0.05"</label>
      <button id="btn-save">Save Layout</button>
      <button id="btn-load">Load Layout</button>
      <button id="btn-library">Load Library</button>
      <button id="btn-export">Export SVG</button>
      <span class="mouse-pos" id="mouse-pos">— , —</span>
    </div>
  </header>

  <main>
    <aside id="palette">
      <h2>Components</h2>
      <div class="hint">Drag onto panel</div>
      <div id="palette-items"></div>
    </aside>

    <section id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>

    <aside id="inspector">
      <h2>Inspector</h2>
      <div id="inspector-content">
        <p class="muted">No element selected.</p>
        <p class="muted small">Click an element to edit. <br>R to rotate · Del to remove · Arrows to nudge.</p>
      </div>
    </aside>
  </main>

  <input type="file" id="file-input" accept=".json" hidden>
  <script src="app.js"></script>
</body>
</html>
